name: Jotul MQTT TLS experimental build
on:
  push:
    branches: [jotul-mqtt-tls]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install platformio==6.1.18
      - name: Test remote command policy
        run: |
          c++ -std=c++11 -Wall -Wextra -Werror test/jotul_policy_test.cpp -o /tmp/jotul-policy-test
          /tmp/jotul-policy-test
      - name: Build experimental ESP8266 firmware and check size
        run: pio run -e jotul_mqtt_tls
      - uses: actions/upload-artifact@v4
        with:
          name: jotul-mqtt-tls-experimental
          if-no-files-found: error
          path: |
            .pio/build/jotul_mqtt_tls/*.bin
            .pio/build/jotul_mqtt_tls/*.size.txt
